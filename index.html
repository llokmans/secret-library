<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Book for You</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage" id="stage">

    <!-- The hidden room behind the bookcase -->
    <section class="room" id="room" aria-hidden="true">
      <div class="room-glow"></div>
      <div class="candle left"><div class="flame"></div></div>
      <div class="candle right"><div class="flame"></div></div>

      <article class="card" id="card" tabindex="-1">
        <p class="card-eyebrow">The pleasure of your company</p>
        <h1 class="card-title">You are expected.</h1>
        <p class="card-date" id="cardDate"></p>

        <div class="divider"><span>✦</span></div>

        <ol class="programme" id="programme"></ol>

        <div class="divider"><span>✦</span></div>

        <p class="dress"><span>Dress</span><em id="dressCode"></em></p>
        <p class="countdown" id="countdown"></p>

        <button class="accept" id="acceptBtn" type="button">I'll be there</button>
        <p class="signature" id="signature"></p>

        <div class="seal" id="seal"><span id="sealInitial"></span></div>
      </article>
    </section>

    <!-- The bookcase (secretly a door) -->
    <section class="bookcase" id="bookcase">
      <div class="crown"><span class="plaque">Private Collection</span></div>
      <div class="shelves" id="shelves"></div>
      <div class="plinth"></div>
    </section>

  </main>

  <!-- The page she reads after pulling the book -->
  <section class="reader" id="reader" aria-hidden="true">
    <article class="page" id="page" tabindex="-1">
      <p class="page-greeting" id="letterGreeting"></p>
      <div class="page-body" id="letterBody"></div>
      <p class="page-closing" id="letterClosing"></p>
      <p class="page-signature" id="letterSignature"></p>
      <button class="turn" id="turnBtn" type="button">Turn the page &rarr;</button>
    </article>
  </section>

  <!-- Atmosphere -->
  <div class="vignette"></div>
  <div class="dust" id="dust"></div>

  <!-- Text overlays -->
  <div class="intro" id="intro">
    <p class="intro-line">Somewhere on these shelves</p>
    <p class="intro-line">there is a book written for you.</p>
  </div>
  <div class="whisper" id="whisper" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
